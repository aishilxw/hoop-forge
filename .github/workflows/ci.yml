name: Check project
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check:secrets
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run validate:data
      - run: npm run build
      - run: node --test deploy/web/tests/game-ai.test.mjs
      - run: node --test deploy/shared-ai/tests/review-service.test.mjs
      - run: npm run package:local
